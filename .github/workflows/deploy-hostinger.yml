name: Deploy to Hostinger (Manual)

# Manual trigger only - will NOT deploy automatically or affect live site without deliberate user action.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log files without uploading)'
        required: false
        default: false
        type: boolean
      clean_slate:
        description: 'Dangerous clean slate (delete remote files not in export)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger Premium
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code validation
        run: npm run validate

      - name: Build Next.js static export
        run: npm run build

      - name: Validate static export integrity
        run: npm run validate:static

      - name: Deploy to Hostinger via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: ./out/
          server-dir: ./
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: ${{ inputs.clean_slate }}
